name: Refresh profile statistics

on:
  push:
    paths:
      - scripts/build_stats.py
      - .github/workflows/refresh-stats.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/build_stats.py
      - name: Commit updated stats
        run: |
          git add assets/stats.svg assets/stats.gif
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh profile statistics"
            git push
          fi
