name: Refresh profile statistics

on:
  push:
    paths:
      - scripts/build_stats.py
      - requirements.txt
      - .github/workflows/refresh-stats.yml
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Refresh animated statistics when data changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m pip install -r requirements.txt
          if [ "${{ github.event_name }}" = "push" ]; then
            python scripts/build_stats.py --force
          else
            python scripts/build_stats.py
          fi
      - name: Commit updated stats
        run: |
          git add assets/stats.svg assets/stats.gif assets/stats-data.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh profile statistics"
            git push
          fi
