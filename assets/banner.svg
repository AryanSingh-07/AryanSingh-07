<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">Aryan Singh — building ideas into software</title>
  <desc id="desc">A colorful gradient with softly floating circles and Aryan's name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#14213d"/>
      <stop offset="0.5" stop-color="#6335b8"/>
      <stop offset="1" stop-color="#f35b89"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#64e9ff"/>
      <stop offset="1" stop-color="#ffe38a"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="290" rx="28" fill="url(#bg)"/>
  <g opacity=".35" filter="url(#blur)">
    <circle cx="130" cy="80" r="76" fill="#00e5ff"><animate attributeName="cy" values="80;110;80" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="220" r="100" fill="#ffdc73"><animate attributeName="cy" values="220;175;220" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="#fff" opacity=".28">
    <circle cx="1040" cy="92" r="50"/>
    <circle cx="1040" cy="92" r="72"/>
    <circle cx="1040" cy="92" r="94"/>
  </g>
  <text x="75" y="117" fill="#dcd4ff" font-family="Arial, sans-serif" font-size="24" letter-spacing="5">WELCOME TO MY CORNER OF GITHUB</text>
  <text x="75" y="193" fill="white" font-family="Arial, sans-serif" font-size="66" font-weight="700">Aryan Singh<tspan fill="url(#shine)">.</tspan></text>
  <rect x="75" y="219" width="300" height="5" rx="3" fill="url(#shine)">
    <animate attributeName="width" values="300;350;300" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
